[package]
name = "svelte-fe-with-rust-be-multi-tenant"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# The Everscribe Rust SDK from the sibling repo (the analog of the Node
# example's "file:../../../sdk-node"), with the axum middleware feature.
everscribe = { path = "../../../sdk-rust", features = ["axum"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
dotenvy = "0.15"
