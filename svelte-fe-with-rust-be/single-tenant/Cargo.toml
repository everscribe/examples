[package]
name = "svelte-fe-with-rust-be-single-tenant"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# The Everscribe Rust SDK from crates.io, with the axum middleware feature.
everscribe = { version = "0.1.1", features = ["axum"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
dotenvy = "0.15"
